  # ==================== Projects ====================
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListEnvelope'
    post:
      tags: [Projects]
      summary: Create project
      description: Creates Project, default Session, and runnable default Flow through a durable forward-only saga. Retrying the same Idempotency-Key returns the original bindings. workspace_root must be under CODEFLOW_WORKSPACE_ROOTS unless CODEFLOW_ALLOW_UNRESTRICTED_WORKSPACE_BINDING=1 is explicitly set.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreationEnvelope'
        '409':
          description: The Idempotency-Key already accepted a different create payload. The response names the conflicting operation and the journaled intent fields that differ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreateConflictEnvelope'

  /api/v1/projects/{id}:
    get:
      tags: [Projects]
      summary: Get project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
    put:
      tags: [Projects]
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectEnvelope'
    delete:
      tags: [Projects]
      summary: Delete project
      description: Archives the Project, aborts active owned Flows, stops process-local workspace runtimes, and records a recoverable lifecycle journal. Session and Flow history are retained for the retention janitor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericMessageEnvelope'

  /api/v1/projects/{id}/stream:
    get:
      tags: [Projects]
      summary: WebSocket stream for project events
      description: |
        The connection may subscribe only to `flow:project:{id}`. Browser clients authenticate
        with the `codeflow.v1` and `codeflow.token.<token>` WebSocket subprotocols.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '101':
          description: WebSocket upgrade
        '401':
          description: Missing or invalid process token
        '403':
          description: Origin is not in the exact allowlist
        '404':
          description: Project not found

  /api/v1/projects/{id}/restore:
    post:
      tags: [Projects]
      summary: Restore an archived project
      description: Reuses the retained Session and creates a runnable default Flow when the archived Flow is terminal. Progress is recorded in a lifecycle journal.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Restored project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreationEnvelope'

  /api/v1/projects/{id}/bind-workspace:
    post:
      tags: [Projects]
      summary: Bind an existing directory as the authoritative workspace
      description: The directory is canonicalized and checked against CODEFLOW_WORKSPACE_ROOTS. New roots are rejected when no allow-list is configured unless CODEFLOW_ALLOW_UNRESTRICTED_WORKSPACE_BINDING=1 is set.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_root]
              properties:
                workspace_root: { type: string }
      responses:
        '200':
          description: Project with canonical workspace binding

  /api/v1/projects/{id}/plans:
    get:
      tags: [Projects]
      summary: List project plans
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
