    # ==================== CodeFlow 3.0 unified envelope (plan §20/§27.3; mirrors backend/schemas/*.schema.json) ====================
    ApiMeta:
      type: object
      required: [request_id]
      description: Response meta (backend/schemas/response.schema.json definitions/meta). request_id is the server-side single-HTTP-trace id (§20.4); command_id appears only on write-command responses and equals the client Idempotency-Key (§20.1/§20.4); revision is the represented resource revision (§20.1).
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        command_id:
          type: string
          minLength: 1
          maxLength: 128
        revision:
          type: integer
          minimum: 1

    ErrorBody:
      type: object
      required: [code, message, retryable]
      description: Unified error body (backend/schemas/error.schema.json). code is the closed 13-value enum fixed in §15 T0.03; clients must branch on code, never on message text. details carries optional structured context (e.g. base_changed expected_commit/current_commit, §20.1).
      properties:
        code:
          type: string
          enum: [unauthorized, auth_expired, protocol_mismatch, forbidden, invalid_request, conflict, idempotency_key_reused, event_gap, policy_denied, backend_unavailable, base_changed, merge_conflict, budget_exceeded]
        message:
          type: string
          minLength: 1
          maxLength: 1024
        retryable:
          type: boolean
        details:
          type: object

    ApiErrorEnvelope:
      type: object
      required: [error, meta]
      description: Failure branch of the unified response envelope (backend/schemas/response.schema.json); mutually exclusive with the success {data, meta} branch.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    CreateRunRequest:
      type: object
      required: [task_id, agent_revision_id, expected_task_revision, expected_binding_revision, prompt, budget]
      description: §20.1 request instance verbatim (field set; field order insignificant). expected_* revisions are optimistic-concurrency preconditions revalidated server-side (§27.3).
      properties:
        task_id:
          type: string
        agent_revision_id:
          type: string
        expected_task_revision:
          type: integer
          minimum: 1
        expected_binding_revision:
          type: integer
          minimum: 1
        prompt:
          type: string
        budget:
          $ref: '#/components/schemas/RunBudget'

    RunBudget:
      type: object
      required: [wall_time_seconds, tokens]
      description: §20.1 budget instance. Server-side defaults, soft/hard limits and deadlines follow §27.6.
      properties:
        wall_time_seconds:
          type: integer
          minimum: 1
        tokens:
          type: integer
          minimum: 1

    Run:
      type: object
      required: [id, status, project_id, task_id, binding_revision, base_commit, agent_revision_id, base_manifest_hash]
      description: Run resource as returned at creation (§20.1 success data instance verbatim). status uses the §21.1 run-state enum; creation always returns queued.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, starting, running, waiting_approval, paused, completed, failed, cancelling, cancelled, recovering, expired]
        project_id:
          type: string
        task_id:
          type: string
        binding_revision:
          type: integer
          minimum: 1
        base_commit:
          type: string
        agent_revision_id:
          type: string
        base_manifest_hash:
          type: string

    CreateRunEnvelope:
      type: object
      required: [data, meta]
      description: Success branch of the unified envelope for run creation (§20.1; meta includes command_id and revision).
      properties:
        data:
          $ref: '#/components/schemas/Run'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    ExecutionIdentity:
      type: object
      required: [project_id, actor]
      description: Execution identity (backend/schemas/execution-identity.schema.json). project_id + actor are required; run_id is present on run events; attempt_id/agent_revision_id exist only while an attempt is alive (§27.1). The server verifies parent/child relations from authoritative resources and never trusts a client-reported actor (§27.1).
      properties:
        project_id:
          type: string
          minLength: 1
          maxLength: 128
        actor:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [user, agent, system, integration]
            id:
              type: string
              minLength: 1
              maxLength: 128
            source:
              type: string
              minLength: 1
              maxLength: 128
        run_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        attempt_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        agent_revision_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128

    ExecutionEvent:
      type: object
      required: [id, scope, project_id, sequence, type, schema_version, occurred_at, identity, payload]
      description: Unified run-domain event (backend/schemas/execution-event.schema.json). sequence is assigned by the server inside one database transaction per scope (§27.4) and is never client-supplied; project-scope and run-scope sequences are independent projections. type is the closed 15-value enum of plan-named event types; payload is event-family data whose per-family minimum structure is fixed by later cards.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        scope:
          type: string
          pattern: '^(project|run):[^:]{1,127}$'
          maxLength: 129
        project_id:
          type: string
          minLength: 1
          maxLength: 128
        run_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 128
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
          enum: [approval.approved, approval.decided, approval.required, budget.soft_exceeded, budget.warning, checkpoint.acknowledged, merge.completed, process.exited, process.started, process.terminated, run.completed, run.failed, scheduler.claimed, server.restart, tool.requested]
        schema_version:
          type: integer
          enum: [1]
        occurred_at:
          type: string
          format: date-time
        identity:
          $ref: '#/components/schemas/ExecutionIdentity'
        payload:
          type: object

    RunEventsPage:
      type: object
      required: [events, next_after, has_more, retention_floor, high_watermark]
      description: Event replay page (§20.2 data instance verbatim). after=0 with retention_floor=1 is the legal first replay; next_after is the cursor for the next request or subscription resume.
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionEvent'
        next_after:
          type: integer
          minimum: 0
        has_more:
          type: boolean
        retention_floor:
          type: integer
          minimum: 1
        high_watermark:
          type: integer
          minimum: 0

    RunEventsEnvelope:
      type: object
      required: [data, meta]
      description: Success branch of the unified envelope for event replay (§20.2).
      properties:
        data:
          $ref: '#/components/schemas/RunEventsPage'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    CommandStatus:
      type: object
      required: [command_id, status]
      description: Command reconciliation view (§20.4/§27.3). status is the closed 4-value command-state enum. This is the §20.4-frozen minimum; operation-specific result fields are added by the owning S1 cards.
      properties:
        command_id:
          type: string
        status:
          type: string
          enum: [accepted, applied, rejected, reconciling]

    CommandEnvelope:
      type: object
      required: [data, meta]
      description: Success branch of the unified envelope for command reconciliation (§20.4).
      properties:
        data:
          $ref: '#/components/schemas/CommandStatus'
        meta:
          $ref: '#/components/schemas/ApiMeta'

    StreamSubscribeFrame:
      type: object
      required: [type, data]
      description: §20.3 WebSocket client first frame over the existing GET /api/v1/projects/{id}/stream route (§27.3 keeps the current bearer/subprotocol auth and Origin checks; no random conversation IDs). Server frame order is subscribed, replay_started, zero or more events, replay_finished, then live events; every live event carries a sequence above the replayed ones. Server control-frame shapes are frozen by the WS-implementing card, not here.
      properties:
        type:
          type: string
          enum: [subscribe]
        data:
          type: object
          required: [resource_type, resource_id, after, client_request_id]
          properties:
            resource_type:
              type: string
              enum: [run, project]
            resource_id:
              type: string
            after:
              type: integer
              minimum: 0
            client_request_id:
              type: string
