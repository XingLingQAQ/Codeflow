  /api/v1/workspace/watch:
    post:
      tags: [Workspace]
      summary: Start (or reuse) a filesystem watcher for a project root
      description: Polls the project root and broadcasts created/modified/deleted events on the per-root websocket topic. Idempotent per resolved root (an existing watch is returned) and capped per process.
      x-codeflow-experimental: true
      parameters:
        - name: X-Codeflow-Workspace-Root
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                root: { type: string }
                interval_ms:
                  type: integer
                  description: Poll cadence in ms, clamped to [250, 60000] (default 2000)
      responses:
        '201':
          description: Watch created (watch_id, root, topic, interval_ms)
        '200':
          description: Existing watch for this resolved root (idempotent)
        '400':
          description: Root missing or invalid
        '409':
          description: Active workspace watch limit reached
        '503':
          description: Workspace service unavailable
    delete:
      tags: [Workspace]
      summary: Stop and remove a filesystem watcher
      x-codeflow-experimental: true
      parameters:
        - name: id
          in: query
          description: Watch id (also accepted as JSON body watch_id)
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                watch_id: { type: string }
      responses:
        '200':
          description: Watch stopped
        '400':
          description: Watch id missing
        '404':
          description: Unknown watch id
        '503':
          description: Workspace service unavailable

