  # ==================== Runs (experimental) ====================
  /api/v1/projects/{pid}/runs:
    post:
      tags: [Runs]
      summary: Create a run for a prepared task
      description: Contract-first CodeFlow 3.0 endpoint (plan §20.1/§27.3); not yet registered in the backend router, implementation lands with the S1 run cards. The client generates the Idempotency-Key before sending and reconciles it as command_id (§20.4); the server never fabricates a queued run when the backend is unavailable (§27.3).
      operationId: createRun
      x-codeflow-experimental: true
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated command id; echoed as meta.command_id (§20.1/§20.4)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: Run accepted (§20.1 success instance; meta carries command_id and revision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunEnvelope'
        '409':
          description: Business-state or idempotency conflict — conflict, idempotency_key_reused, or base_changed with details.expected_commit/current_commit (§20.1 failure instance, §27.3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: Field or contract invalid — invalid_request (§27.3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '503':
          description: Execution backend unavailable — backend_unavailable (§27.3); no placeholder run is created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/projects/{pid}/runs/{rid}/events:
    get:
      tags: [Runs]
      summary: Replay run events after a sequence cursor
      description: Contract-first CodeFlow 3.0 endpoint (plan §20.2/§27.3-§27.4); not yet registered in the backend router. after=0 with retention_floor=1 is a legal first replay (§20.2); sequence is the server-assigned run-scope projection, never client-supplied (§27.4). The client reads a consistent snapshot first, then resumes from the returned cursor (§20.2).
      operationId: listRunEvents
      x-codeflow-experimental: true
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
        - name: rid
          in: path
          required: true
          schema:
            type: string
        - name: after
          in: query
          required: true
          description: Replay strictly after this scope sequence, 0 or greater (§27.3)
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Page size — default 200, maximum 1000 (§27.3)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: Event page (§20.2 instance — events/next_after/has_more/retention_floor/high_watermark)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventsEnvelope'
        '410':
          description: Cursor older than retention_floor-1 — event_gap with details.snapshot_url for snapshot-based resync (§20.2/§27.4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '422':
          description: after exceeds the current high_watermark (§27.4) — invalid_request; the flow-control reason invalid_cursor travels in details.reason per the §15 T0.03 namespace ruling (outside the closed error-code enum)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

  /api/v1/projects/{pid}/commands/{command_id}:
    get:
      tags: [Runs]
      summary: Reconcile a command by client idempotency key
      description: Contract-first CodeFlow 3.0 endpoint (plan §20.4/§27.3); not yet registered in the backend router. After a client-side timeout the client keeps the Idempotency-Key it generated before sending and reconciles here; re-sending the same key with an identical body is safe, and a command with external side effects whose outcome is unknown stays reconciling and must not be started a second time (§20.4).
      operationId: getCommand
      x-codeflow-experimental: true
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: string
        - name: command_id
          in: path
          required: true
          description: The client-generated Idempotency-Key of the original write command (§20.4)
          schema:
            type: string
      responses:
        '200':
          description: Command status — accepted/applied/rejected/reconciling (§20.4)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
        '404':
          description: No command record for this key, principal and project (§20.4) — the error body uses the unified ErrorEnvelope; command_not_found is the command-layer reason and per the §15 T0.03 namespace ruling is not part of the closed error-code enum, it is carried in error.details.reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'

components:
  securitySchemes:
    SidecarBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-process-token
      description: Process-lifetime token received from the sidecar startup handshake.
  schemas:
    Response:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            status:
              type: string
            version:
              type: string

    ReadinessEnvelope:
      type: object
      description: Envelope of GET /ready (plan §15 T0.12).
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [status, components, capabilities]
          properties:
            status:
              type: string
              enum: [ready, not_ready]
            version:
              type: string
            components:
              type: object
              description: One entry per legacy Has* service and per registered probe, keyed by component name.
              additionalProperties:
                $ref: '#/components/schemas/ReadinessComponent'
            capabilities:
              $ref: '#/components/schemas/ReadinessCapabilities'

    ReadinessComponent:
      type: object
      description: |
        One dependency entry. Legacy Has* services publish ready/required only; probe-backed entries
        add status/readonly/error_code/latency_ms/detail/checked_at (plan §15 T0.12 step 2).
      required: [ready, required]
      properties:
        ready:
          type: boolean
        required:
          type: boolean
          description: A required entry that is not ready makes /ready answer 503.
        status:
          type: string
          enum: [ready, degraded, failed, not_configured]
          description: Machine-readable dependency state; present only on probe-backed entries.
        readonly:
          type: boolean
          description: The probe declares itself read-only (no writes, no network).
        error_code:
          type: string
          description: Stable reason of the most recent non-ready state (for example vault_locked, workspace_root_missing, probe_timeout).
        latency_ms:
          type: integer
          description: Wall time of the probe run this response observed.
        detail:
          type: string
        checked_at:
          type: string
          description: RFC3339 UTC timestamp of the probe run.

    ReadinessCapabilities:
      type: object
      description: |
        Capability sets derived from the same snapshot as components (plan §15 T0.12 step 3): read_only
        is global, execution is per backend, merge adds the merge-specific dependencies.
      required: [read_only, execution, merge]
      properties:
        read_only:
          $ref: '#/components/schemas/ReadinessCapability'
        execution:
          allOf:
            - $ref: '#/components/schemas/ReadinessCapability'
            - type: object
              properties:
                backends:
                  type: object
                  description: Per-backend execution capability, keyed by backend name without the exec_backend prefix.
                  additionalProperties:
                    $ref: '#/components/schemas/ReadinessCapability'
        merge:
          $ref: '#/components/schemas/ReadinessCapability'

    ReadinessCapability:
      type: object
      description: One capability verdict; a not-ready capability lists what blocks it.
      required: [state, blocking]
      properties:
        state:
          type: string
          enum: [ready, unavailable]
        blocking:
          type: array
          description: Blocking dependencies, sorted by component then error code. Empty when state is ready.
          items:
            $ref: '#/components/schemas/ReadinessBlocker'

    ReadinessBlocker:
      type: object
      description: One dependency that keeps a capability from being ready.
      required: [component, state, error_code, remediation]
      properties:
        component:
          type: string
          description: Component name; exec_backend prefixed names carry the backend suffix.
        state:
          type: string
          enum: [ready, degraded, failed, not_configured]
        error_code:
          type: string
        remediation:
          type: string
          description: |
            Machine-readable action that would unblock the dependency: backend_not_installed,
            migrations_pending, vault_locked, outbox_unavailable, event_store_unavailable,
            workspace_roots_unconfigured, workspace_root_missing, policy_not_installed,
            protocol_mismatch, or dependency_not_ready.

