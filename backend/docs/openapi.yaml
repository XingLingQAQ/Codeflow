      type: object
      required: [plaintext, verified]
      properties:
        plaintext:
          type: string
        verified:
          type: boolean

    EncryptedData:
      type: object
      required: [ciphertext, iv, salt, algorithm]
      properties:
        ciphertext:
          type: string
          format: byte
        iv:
          type: string
          format: byte
        salt:
          type: string
          format: byte
        algorithm:
          type: string
          enum: [aes-256-gcm, aes-256-cbc, aes-128-cbc]
          description: New writes use aes-256-gcm; CBC values are accepted only for legacy reads.
        tag:
          type: string
          format: byte
          description: Required for aes-256-gcm records.

    ChainEncryptedData:
      type: object
      required: [node_id, ciphertext, iv, integrity_hash, algorithm]
      properties:
        node_id:
          type: string
        ciphertext:
          type: string
          format: byte
        iv:
          type: string
          format: byte
        integrity_hash:
          type: string
        algorithm:
          type: string
          enum: [aes-256-gcm-chain, aes-256-cbc-chain]
          description: New writes use aes-256-gcm-chain; CBC is legacy read-only.

