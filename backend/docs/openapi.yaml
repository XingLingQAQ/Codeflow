openapi: 3.0.3
info:
  title: CodeFlow Backend API
  description: |
    CodeFlow Backend API provides endpoints for memory management, search, context analysis,
    agent management, blackboard collaboration, debate system, and task planning.
    The desktop launcher reads `CODEFLOW_HANDSHAKE:{...}` from the sidecar process and keeps
    its process-lifetime token in memory. All operations except `/health` require that token.
    Session messages, conversation traces, memory items, atomic/vector memory, and SAMG graph
    state use durable SQLite stores in production. A missing required store returns 503 instead
    of creating an empty in-memory service. Every authenticated mutation produces a baseline
    audit record for both success and failure; retained audit files remain verifiable from a
    persisted rotation anchor.
  version: 0.1.0
  contact:
    name: CodeFlow Team
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:{port}
    description: Loopback sidecar; the actual port comes from the startup handshake
    variables:
      port:
        default: '8080'

security:
  - SidecarBearer: []

tags:
  - name: Health
    description: Health check endpoints
  - name: Memory
    description: Durable STM/LTM memory management with stable limit/offset pagination
  - name: MemoryPreflight
    description: Progressive memory disclosure with semantic preflight
  - name: Search
    description: Vector, fulltext, graph, and hybrid search
  - name: Context
    description: File tree, AST parsing, and token calculation
  - name: Agents
    description: Agent management and monitoring
  - name: Conversations
    description: Conversation management and streaming
  - name: Blackboard
    description: Multi-agent collaboration blackboard
  - name: Votes
    description: BFT consensus voting
  - name: Debates
    description: Generator/Critic debate system
  - name: Plans
    description: Task planning and management
  - name: Snapshots
    description: Atomic snapshot creation, restoration, and management
  - name: Config
    description: Multi-level configuration (Global/Session/Role)
  - name: PAPI
    description: PAPI variable routing and hot-swap
  - name: Hooks
    description: Lifecycle hook management
  - name: Summarize
    description: Conversation summarization and context compression
  - name: Audit
    description: Tamper-evident mutation history with startup verification and anchored retention
  - name: Privacy
    description: Privacy-aware encryption, decryption, and PII redaction
  - name: Isolation
    description: Multi-agent permission isolation and RBAC
  - name: SAMG
    description: Semantic memory graph with spreading activation and decay
  - name: Flows
    description: Flow engine (experimental) — stage state machine
  - name: Workspace
    description: Project-root filesystem (experimental) — list/read/write via guard
  - name: Skills
    description: Skill registry (experimental) — match and prompt injection
  - name: Guard
    description: Write policy guard (experimental) — dry-run check and AST index
  - name: Runs
    description: Run execution (experimental) — CodeFlow 3.0 run/event/command contracts, contract-first per plan §20/§27.3

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [Health]
      summary: Readiness check (reports component wiring and capability sets)
      description: |
        Reports the read-only dependency probes and the derived capability sets (plan §15 T0.12).
        The HTTP status answers only whether the required legacy services and required probes are
        wired: 200 ready, 503 not_ready. Dependencies that are planned but not wired yet (the
        runtime database/migrations, event store, outbox dispatcher, vault, execution backends)
        report status not_configured with their remediation code and never gate the status, so the
        shell can start and offer the read-only surface. Whether a Run may be created is answered by
        data.capabilities.execution (per backend) and whether work may be merged by
        data.capabilities.merge; every non-ready capability lists its blocking dependencies with a
        stable remediation code. Probes are read-only and bounded; repairing a dependency is visible
        on the next poll without restarting the frontend.
      responses:
        '200':
          description: Required services and required probes are ready (individual optional dependencies may still be not_configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessEnvelope'
        '503':
          description: One or more required components are not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessEnvelope'

  /metrics:
    get:
      tags: [Health]
      summary: Request metrics snapshot
      responses:
        '200':
          description: Trace and metrics snapshot

  /api/v1/memory/items:
    get:
      tags: [Memory]
      summary: List memory items
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [stm, ltm]
        - name: session_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, pending_archive, pending_delete]
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [timestamp, heat, surprise]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of memory items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListEnvelope'
        '503':
          description: Durable memory service is not initialized
    post:
      tags: [Memory]
      summary: Create memory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreateRequest'
      responses:
        '201':
          description: Memory item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryItemEnvelope'
        '503':
          description: Durable memory service is not initialized

  /api/v1/memory/items/{id}:
    patch:
      tags: [Memory]
      summary: Update memory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdateRequest'
      responses:
        '200':
          description: Memory item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryItemEnvelope'
    delete:
      tags: [Memory]
      summary: Delete memory item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memory item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDeleteEnvelope'

  /api/v1/memory/items/{id}/archive:
    post:
      tags: [Memory]
      summary: Archive memory item (STM to LTM)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memory item archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryItemEnvelope'

  /api/v1/memory/items/{id}/restore:
    post:
      tags: [Memory]
      summary: Restore memory item (LTM to STM)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memory item restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryItemEnvelope'

  /api/v1/search/vector:
    post:
      tags: [Search]
      summary: Vector similarity search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /api/v1/search/fulltext:
    post:
      tags: [Search]
      summary: Full-text search with highlighting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulltextSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /api/v1/search/graph:
    post:
      tags: [Search]
      summary: Graph/triple search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSearchResponse'

  /api/v1/search/hybrid:
    post:
      tags: [Search]
      summary: Hybrid search combining vector, fulltext, and graph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /api/v1/context/files:
    get:
      tags: [Context]
      summary: Get file tree
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: max_depth
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: File tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTreeResponse'

  /api/v1/context/ast:
    post:
      tags: [Context]
      summary: Parse AST from file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ASTRequest'
      responses:
        '200':
          description: AST nodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ASTResponse'

  /api/v1/context/tokens:
    post:
      tags: [Context]
      summary: Calculate token count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /api/v1/context/presets:
    get:
      tags: [Context]
      summary: List context presets
      responses:
        '200':
          description: List of presets
    post:
      tags: [Context]
      summary: Create context preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetCreateRequest'
      responses:
        '201':
          description: Preset created

  /api/v1/context/presets/{id}:
    delete:
      tags: [Context]
      summary: Delete context preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Preset deleted

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: List active agents
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
    post:
      tags: [Agents]
      summary: Create agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: { type: string }
                role: { type: string }
                model: { type: string }
                session_id: { type: string }
      responses:
        '201':
          description: Agent created
        '400':
          description: Invalid request body

  /api/v1/agents/{id}:
    get:
      tags: [Agents]
      summary: Get agent by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent detail
        '404':
          description: Agent not found
    put:
      tags: [Agents]
      summary: Update agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string }
                status: { type: string }
                model: { type: string }
                session_id: { type: string }
      responses:
        '200':
          description: Agent updated
        '404':
          description: Agent not found
    delete:
      tags: [Agents]
      summary: Delete agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent deleted
        '404':
          description: Agent not found

  /api/v1/agents/{id}/logs:
    get:
      tags: [Agents]
      summary: Get agent logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Agent logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLogsResponse'

  /api/v1/agents/registry:
    get:
      tags: [Agents]
      summary: List agent registry assets
      x-codeflow-experimental: true
      parameters:
        - name: stage
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [main, coder, sub, critic, researcher]
        - name: source
          in: query
          schema:
            type: string
            enum: [builtin, user, plugin]
      responses:
        '200':
          description: Agent asset list
        '503':
          description: Agent registry not available
    post:
      tags: [Agents]
      summary: Create an agent registry asset
      x-codeflow-experimental: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role_base]
              properties:
                name: { type: string }
                role_base:
                  type: string
                  enum: [main, coder, sub, critic, researcher]
                avatar: { type: string }
                description: { type: string }
                version: { type: string }
                source:
                  type: string
                  enum: [user, plugin]
                system_prompt: { type: string }
                binding:
                  type: object
                  properties:
                    model: { type: string }
                    channel: { type: string }
                    temperature: { type: number }
                    max_tokens: { type: integer }
                mounts:
                  type: object
                  properties:
                    mcp_tools:
                      type: array
                      items: { type: string }
                    skills:
                      type: array
                      items: { type: string }
                stage_tags:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Agent asset created
        '400':
          description: Invalid request body
        '503':
          description: Agent registry not available

  /api/v1/agents/registry/{id}:
    get:
      tags: [Agents]
      summary: Get agent registry asset by ID
      x-codeflow-experimental: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent asset detail
        '404':
          description: Agent asset not found
        '503':
          description: Agent registry not available
    patch:
      tags: [Agents]
      summary: Update agent registry asset
      x-codeflow-experimental: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatar: { type: string }
                description: { type: string }
                version: { type: string }
                role_base:
                  type: string
                  enum: [main, coder, sub, critic, researcher]
                system_prompt: { type: string }
                binding: { type: object }
                mounts: { type: object }
                stage_tags:
                  type: array
                  items: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: Agent asset updated
        '404':
          description: Agent asset not found
        '409':
          description: Builtin agent cannot be modified
        '503':
          description: Agent registry not available
    delete:
      tags: [Agents]
      summary: Delete agent registry asset
      x-codeflow-experimental: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent asset deleted
        '404':
          description: Agent asset not found
        '409':
          description: Builtin agent cannot be deleted
        '503':
          description: Agent registry not available

  /api/v1/agents/registry/{id}/usage:
    post:
      tags: [Agents]
      summary: Increment usage counter for an agent asset
      x-codeflow-experimental: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usage incremented
        '404':
          description: Agent asset not found
        '503':
          description: Agent registry not available

  /api/v1/agents/registry/{id}/score:
    post:
      tags: [Agents]
      summary: Set quality score for an agent asset
      x-codeflow-experimental: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: number
                  format: double
      responses:
        '200':
          description: Score updated
        '404':
          description: Agent asset not found
        '503':
          description: Agent registry not available

  /api/v1/integrations:
    get:
      tags: [Integrations]
      summary: List registered integrations
      responses:
        '200':
          description: Integration list
    post:
      tags: [Integrations]
      summary: Register a governed integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manifest:
                  type: object
                  description: Integration manifest (name, version, endpoints)
                signature:
                  type: object
                  description: Manifest signature envelope
                policy:
                  type: object
                  description: Governance policy (permissions, limits)
                actor:
                  type: object
                  description: Audit actor performing the registration
      responses:
        '201':
          description: Integration registered
        '400':
          description: Invalid manifest
        '403':
          description: Permission denied

  /api/v1/integrations/{id}:
    get:
      tags: [Integrations]
      summary: Get integration by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Integration detail
        '404':
          description: Integration not found

  /api/v1/integrations/{id}/invoke:
    post:
      tags: [Integrations]
      summary: Invoke a registered integration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: object
                  description: Audit actor performing the invocation
                payload:
                  description: Arbitrary invocation payload
                session_id: { type: string }
                description: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Invocation result
        '404':
          description: Integration not found

  /api/v1/integrations/{id}/replay:
    post:
      tags: [Integrations]
      summary: Restore snapshot and replay an invocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actor:
                  type: object
                  description: Audit actor performing the replay
                invocation_id: { type: string }
      responses:
        '200':
          description: Replay result (restore evidence and new invocation)
        '404':
          description: Integration or invocation not found

  /api/v1/conversations/{sessionId}/trace:
    get:
      tags: [Conversations]
      summary: Get conversation call trace
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Call trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallTraceResponse'
        '503':
          description: Durable conversation service is not initialized

  /api/v1/conversations/{sessionId}/stop:
    post:
      tags: [Conversations]
      summary: Stop conversation
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation stopped

  /api/v1/conversations/{sessionId}/retry:
    post:
      tags: [Conversations]
      summary: Retry conversation
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation retried

  /api/v1/conversations/{sessionId}/stream:
    get:
      tags: [Conversations]
      summary: WebSocket stream for conversation
      description: |
        The route fixes the connection to this session. The client cannot switch session or
        subscribe to project/debate topics. Native clients use Bearer auth; browser clients
        offer `codeflow.v1` and `codeflow.token.<token>` WebSocket subprotocols.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '101':
          description: WebSocket upgrade
        '401':
          description: Missing or invalid process token
        '403':
          description: Origin is not in the exact allowlist
        '404':
          description: Conversation not found

  /api/v1/blackboard/entries:
    get:
      tags: [Blackboard]
      summary: List blackboard entries
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [state, proposal, decision, artifact]
        - name: author
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryListResponse'
    post:
      tags: [Blackboard]
      summary: Create blackboard entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreateRequest'
      responses:
        '201':
          description: Entry created

  /api/v1/blackboard/entries/{id}:
    patch:
      tags: [Blackboard]
      summary: Update blackboard entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryUpdateRequest'
      responses:
        '200':
          description: Entry updated
    delete:
      tags: [Blackboard]
      summary: Delete blackboard entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry deleted

  /api/v1/votes:
    post:
      tags: [Votes]
      summary: Create vote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCreateRequest'
      responses:
        '201':
          description: Vote created

  /api/v1/votes/{id}:
    get:
      tags: [Votes]
      summary: Get vote status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vote status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'

  /api/v1/votes/{id}/cast:
    post:
      tags: [Votes]
      summary: Cast vote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCastRequest'
      responses:
        '200':
          description: Vote cast

  /api/v1/debates:
    get:
      tags: [Debates]
      summary: List debates
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: flow_id
          in: query
          schema:
            type: string
        - name: stage_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
